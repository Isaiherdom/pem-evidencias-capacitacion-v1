<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Instructor — Evidencias de Capacitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root{
    --ink:#12181B; --ink-soft:#4A555B; --paper:#EFF1EE; --panel:#FFFFFF; --line:#D9DCD6;
    --amber:#C1580A; --amber-dark:#9C4508; --teal:#1B6F5C; --teal-soft:#E4F0EC; --red:#B3261E;
    --shadow: 0 1px 2px rgba(18,24,27,0.06), 0 8px 24px rgba(18,24,27,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .mono{font-family:'IBM Plex Mono', monospace;}

  .topbar{ background:var(--ink); color:#F2F1ED; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .topbar .brand{font-size:15px; font-weight:600;}
  .topbar .user{font-size:12.5px; color:#C9CFC6; display:flex; align-items:center; gap:12px;}
  .topbar .user button{ background:none; border:1px solid #3A4448; color:#C9CFC6; border-radius:7px; padding:6px 12px; font-family:inherit; font-size:12px; cursor:pointer; }
  .topbar .user button:hover{border-color:#6B7A80;}

  .wrap{ max-width:760px; margin:0 auto; padding:48px 24px 64px; }

  /* Login screen */
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:48px 36px; text-align:center; max-width:420px; margin:80px auto 0;
  }
  .login-card h1{font-size:20px; margin:0 0 8px;}
  .login-card p{font-size:13.5px; color:var(--ink-soft); margin:0 0 28px; line-height:1.5;}
  .btn-ms{
    display:inline-flex; align-items:center; gap:10px; background:var(--ink); color:#fff; border:none;
    border-radius:9px; padding:13px 22px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; width:100%;
    justify-content:center;
  }
  .btn-ms:hover{background:#232B2F;}
  .btn-ms svg{width:16px; height:16px;}

  /* Panel */
  h2{font-size:19px; margin:0 0 4px;}
  .subhead{font-size:13px; color:var(--ink-soft); margin:0 0 24px;}
  .event-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .event-card .info .nombre{font-size:14.5px; font-weight:600; margin-bottom:3px;}
  .event-card .info .meta{font-size:12px; color:var(--ink-soft);}
  .badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:6px; }
  .badge-abierto{background:var(--teal-soft); color:var(--teal);}
  .badge-cerrado{background:#EFEAE2; color:var(--ink-soft);}
  .btn{ appearance:none; border:none; border-radius:8px; padding:10px 16px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-primary{background:var(--amber); color:#fff;}
  .btn-primary:hover{background:var(--amber-dark);}
  .btn-primary:disabled{background:#D8CFC4; color:#8C8378; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .empty{ text-align:center; padding:60px 20px; color:#A7ACA7; font-size:13.5px; }
  .pdf-ready{ display:inline-block; margin-top:8px; font-size:12.5px; font-weight:600; color:var(--teal); text-decoration:none; border:1px solid var(--teal); border-radius:7px; padding:6px 12px; }
  .status-line{ font-size:12px; color:var(--ink-soft); margin-top:8px; }
  .error-box{ background:#FBEEED; border:1px solid #E7C6C3; color:var(--red); border-radius:8px; padding:12px 14px; font-size:13px; margin-bottom:16px; }

  .create-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:28px;
  }
  .create-card h3{font-size:15px; margin:0 0 4px;}
  .create-card .sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px;}
  .create-form{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .create-form .full{grid-column:1/-1;}
  .create-form label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  .create-form input, .create-form select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-family:inherit; font-size:13.5px; background:#FBFBFA;
  }
  .create-form input:focus, .create-form select:focus{ outline:none; border-color:var(--amber); background:#fff; }

  .link-box{
    margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
    display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;
  }
  .link-box canvas{ border:1px solid var(--line); border-radius:8px; }
  .link-box .urlrow{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .link-box input.urlfield{
    flex:1; min-width:220px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:#FBFBFA;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft);
  }
  .link-toggle{ font-size:12.5px; color:var(--teal); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; font-family:inherit; }
  .btn-delete{
    background:none; border:1px solid var(--line); border-radius:7px; width:34px; height:34px;
    font-size:14px; cursor:pointer; color:var(--ink-soft); flex-shrink:0;
  }
  .btn-delete:hover{ border-color:var(--red); color:var(--red); }
</style>
</head>
<body>

<div id="app"></div>

<script>
const SUPABASE_URL = "https://wrhrqlnuiaowymyflpwn.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyaHJxbG51aWFvd3lteWZscHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjMzMTEsImV4cCI6MjEwNDk5OTMxMX0.SELZqmZUWjkFtXPtMqByvQSC_obKuTlwBeL1PN0GDpc";
const supa = window.supabase.createClient(SUPABASE_URL, ANON_KEY);
const REGISTRO_URL = new URL('prototipo-evidencias-conectado.html', window.location.href).href;

const app = document.getElementById('app');
let session = null;
let miPerfil = null;

async function init(){
  const { data } = await supa.auth.getSession();
  session = data.session;
  supa.auth.onAuthStateChange((_event, s) => { session = s; render(); });
  render();
}

function render(){
  if(!session){ renderLogin(); return; }
  renderPanel();
}

function renderLogin(){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">Evidencias de Capacitación — PEM</div>
      <div class="user"></div>
    </div>
    <div class="wrap">
      <div class="login-card">
        <h1>Panel del instructor</h1>
        <p>Inicia sesión con tu cuenta de Microsoft de PEM para ver tus eventos, cerrarlos y generar el reporte de evidencias.</p>
        <button class="btn-ms" onclick="login()">
          <svg viewBox="0 0 21 21"><rect width="9" height="9" x="1" y="1" fill="#f25022"/><rect width="9" height="9" x="11" y="1" fill="#7fba00"/><rect width="9" height="9" x="1" y="11" fill="#00a4ef"/><rect width="9" height="9" x="11" y="11" fill="#ffb900"/></svg>
          Iniciar sesión con Microsoft
        </button>
      </div>
    </div>`;
}

async function login(){
  await supa.auth.signInWithOAuth({
    provider: 'azure',
    options: { scopes: 'email', redirectTo: window.location.href }
  });
}

async function logout(){
  await supa.auth.signOut();
  session = null;
  render();
}

async function renderPanel(){
  const correo = session.user.email || '';
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">Evidencias de Capacitación — PEM</div>
      <div class="user">${correo} <button onclick="logout()">Cerrar sesión</button></div>
    </div>
    <div class="wrap">

      <div class="create-card">
        <h3>Crear nuevo evento</h3>
        <p class="sub">Al crearlo se genera automáticamente el link y el QR de registro para compartir.</p>
        <div id="createArea"><div class="empty" style="padding:20px;">Cargando tu perfil…</div></div>
      </div>

      <h2>Tus eventos</h2>
      <p class="subhead">Eventos donde eres instructor, o todos los de tu organización si eres administrador.</p>
      <div id="eventsList"><div class="empty">Cargando…</div></div>
    </div>`;

  const { data: perfil, error: perfilErr } = await supa
    .from('profiles')
    .select('id, is_admin, organizacion_id')
    .eq('id', session.user.id)
    .maybeSingle();
  miPerfil = perfil;

  const createArea = document.getElementById('createArea');
  if(!perfil || !perfil.organizacion_id){
    createArea.innerHTML = `<p class="status-line">Tu cuenta todavía no tiene una organización asignada — pídele a Isaí que te la asigne para poder crear eventos.</p>`;
  } else {
    createArea.innerHTML = `
      <div class="create-form">
        <div>
          <label>Nombre del evento</label>
          <input id="nf-nombre" placeholder="Ej. Inducción ISO 45001 — Base Reynosa">
        </div>
        <div>
          <label>Tipo</label>
          <select id="nf-tipo">
            <option value="presencial">Presencial</option>
            <option value="teams">Reunión Teams</option>
          </select>
        </div>
        <div>
          <label>Fecha</label>
          <input id="nf-fecha" type="date">
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button class="btn btn-primary" style="width:100%" onclick="crearEvento()">Crear evento</button>
        </div>
      </div>
      <div id="createError"></div>
      <div id="createResult"></div>`;
    document.getElementById('nf-fecha').value = new Date().toISOString().slice(0,10);
  }

  await cargarEventos();
}

async function cargarEventos(){
  const { data: eventos, error } = await supa
    .from('eventos')
    .select('id, nombre, tipo, fecha, estado, token_acceso, reportes_pdf(estado, storage_path)')
    .order('fecha', { ascending: false });

  const listEl = document.getElementById('eventsList');

  if(error){
    listEl.innerHTML = `<div class="error-box">No se pudieron cargar tus eventos: ${error.message}<br><br>
      Si tu cuenta acaba de iniciar sesión por primera vez, es probable que aún no tengas permisos de instructor/admin asignados — pídele a Isaí que te los asigne.</div>`;
    return;
  }

  if(!eventos || eventos.length === 0){
    listEl.innerHTML = `<div class="empty">Todavía no tienes eventos. Crea el primero arriba.</div>`;
    return;
  }

  listEl.innerHTML = eventos.map(ev => {
    const reporte = Array.isArray(ev.reportes_pdf) ? ev.reportes_pdf[0] : ev.reportes_pdf;
    let accion = '';
    if(ev.estado === 'abierto'){
      accion = `<button class="btn btn-primary" onclick="cerrarYGenerar('${ev.id}')">Cerrar evento y generar PDF</button>`;
    } else if(reporte && reporte.estado === 'listo'){
      accion = `<a class="pdf-ready" href="#" onclick="descargarPdf('${reporte.storage_path}'); return false;">Descargar PDF</a>
        <button class="btn btn-ghost" style="margin-left:8px" onclick="generarPdf('${ev.id}')">Regenerar</button>`;
    } else if(reporte && reporte.estado === 'procesando'){
      accion = `<span class="status-line">Generando PDF…</span>`;
    } else if(reporte && reporte.estado === 'error'){
      accion = `<button class="btn btn-ghost" onclick="generarPdf('${ev.id}')">Reintentar generar PDF</button>`;
    } else {
      accion = `<button class="btn btn-ghost" onclick="generarPdf('${ev.id}')">Generar PDF</button>`;
    }
    const linkToggle = ev.estado === 'abierto'
      ? `<div><button class="link-toggle" onclick="toggleQr('${ev.id}', '${ev.token_acceso}')">Ver link / QR de registro</button></div>`
      : '';
    return `
      <div class="event-card" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div class="info">
            <div class="nombre">${ev.nombre}</div>
            <div class="meta">${ev.tipo === 'teams' ? 'Reunión Teams' : 'Presencial'} · ${ev.fecha} ·
              <span class="badge ${ev.estado === 'abierto' ? 'badge-abierto' : 'badge-cerrado'}">${ev.estado}</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div id="accion-${ev.id}">${accion}</div>
            <button class="btn-delete" title="Eliminar evento" onclick="eliminarEvento('${ev.id}', '${ev.nombre.replace(/'/g, "\\'")}')">🗑</button>
          </div>
        </div>
        ${linkToggle}
        <div id="qr-${ev.id}"></div>
      </div>`;
  }).join('');
}

function toggleQr(eventoId, token){
  const box = document.getElementById(`qr-${eventoId}`);
  if(box.innerHTML){ box.innerHTML = ''; return; }
  const url = `${REGISTRO_URL}?token=${token}`;
  box.innerHTML = `
    <div class="link-box">
      <div style="flex:1; min-width:220px;">
        <div class="urlrow">
          <input class="urlfield" readonly value="${url}" id="urlfield-${eventoId}">
          <button class="btn btn-ghost" onclick="copiarLink('${eventoId}')">Copiar</button>
        </div>
        <p class="status-line">Comparte este link o el QR con los asistentes — no necesitan cuenta.</p>
      </div>
      <canvas id="qrcanvas-${eventoId}"></canvas>
    </div>`;
  QRCode.toCanvas(document.getElementById(`qrcanvas-${eventoId}`), url, { width: 130, margin: 1 });
}

function copiarLink(eventoId){
  const field = document.getElementById(`urlfield-${eventoId}`);
  field.select();
  navigator.clipboard.writeText(field.value);
}

async function eliminarEvento(eventoId, nombre){
  if(!confirm(`¿Eliminar "${nombre}"? Esto borra el evento, sus asistentes, firmas, fotos y el PDF de forma permanente. No se puede deshacer.`)) return;

  const { data: asistentes } = await supa
    .from('asistentes')
    .select('evidencias(firma_path, foto_path)')
    .eq('evento_id', eventoId);

  const paths = [];
  (asistentes ?? []).forEach(a => {
    const ev = Array.isArray(a.evidencias) ? a.evidencias[0] : a.evidencias;
    if(ev?.firma_path) paths.push(ev.firma_path);
    if(ev?.foto_path) paths.push(ev.foto_path);
  });
  paths.push(`reportes/${eventoId}.pdf`);

  if(paths.length) await supa.storage.from('evidencias').remove(paths);

  const { error } = await supa.from('eventos').delete().eq('id', eventoId);
  if(error){ alert('No se pudo eliminar el evento: ' + error.message); return; }

  await cargarEventos();
}

async function crearEvento(){
  const nombre = document.getElementById('nf-nombre').value.trim();
  const tipo = document.getElementById('nf-tipo').value;
  const fecha = document.getElementById('nf-fecha').value;
  const errBox = document.getElementById('createError');
  errBox.innerHTML = '';

  if(!nombre || !fecha){
    errBox.innerHTML = `<div class="error-box">Ponle nombre y fecha al evento.</div>`;
    return;
  }

  const { data, error } = await supa
    .from('eventos')
    .insert({
      organizacion_id: miPerfil.organizacion_id,
      nombre, tipo, fecha,
      instructor_id: session.user.id,
      creado_por: session.user.id,
    })
    .select('id, nombre, token_acceso')
    .single();

  if(error){
    errBox.innerHTML = `<div class="error-box">No se pudo crear el evento: ${error.message}</div>`;
    return;
  }

  document.getElementById('nf-nombre').value = '';
  const url = `${REGISTRO_URL}?token=${data.token_acceso}`;
  const resultBox = document.getElementById('createResult');
  resultBox.innerHTML = `
    <div class="link-box" style="margin-top:16px;">
      <div style="flex:1; min-width:220px;">
        <p class="status-line" style="margin-bottom:8px;"><strong style="color:var(--teal)">Evento creado:</strong> ${data.nombre}</p>
        <div class="urlrow">
          <input class="urlfield" readonly value="${url}" id="newlink">
          <button class="btn btn-ghost" onclick="document.getElementById('newlink').select(); navigator.clipboard.writeText('${url}')">Copiar</button>
        </div>
      </div>
      <canvas id="newqr"></canvas>
    </div>`;
  QRCode.toCanvas(document.getElementById('newqr'), url, { width: 130, margin: 1 });

  await cargarEventos();
}

async function cerrarYGenerar(eventoId){
  const cont = document.getElementById(`accion-${eventoId}`);
  cont.innerHTML = `<span class="status-line">Cerrando evento…</span>`;
  try{
    const { error: rpcErr } = await supa.rpc('cerrar_evento', { p_evento_id: eventoId });
    if(rpcErr) throw rpcErr;
    await generarPdf(eventoId);
  }catch(err){
    cont.innerHTML = `<span class="status-line" style="color:var(--red)">Error: ${err.message}</span>`;
  }
}

async function generarPdf(eventoId){
  const cont = document.getElementById(`accion-${eventoId}`);
  cont.innerHTML = `<span class="status-line">Generando PDF…</span>`;
  try{
    const { data, error } = await supa.functions.invoke('generar-pdf-evento', { body: { evento_id: eventoId } });
    if(error) throw error;
    cont.innerHTML = `<a class="pdf-ready" href="#" onclick="descargarPdf('${data.storage_path}'); return false;">Descargar PDF</a>`;
  }catch(err){
    cont.innerHTML = `<span class="status-line" style="color:var(--red)">Error generando el PDF: ${err.message}</span>`;
  }
}

async function descargarPdf(storagePath){
  const { data, error } = await supa.storage.from('evidencias').createSignedUrl(storagePath, 60);
  if(error){ alert('No se pudo generar el link de descarga: ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

init();
</script>

</body>
</html>
